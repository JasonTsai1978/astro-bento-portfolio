<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 808" width="440" height="808" role="img" aria-label="Preparation: AI reads the spec, I make the calls, we build the template and tool"><title>Preparation: AI reads the spec, I make the calls, we build the template and tool</title><style>
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif}
.t{fill:#f5f5f5;font-size:15px;font-weight:600}
.s{fill:#a3a3a3;font-size:12.5px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em}
.cap{fill:#a3a3a3;font-size:11px;letter-spacing:.12em;font-weight:700}
.g{fill:#fda4af;font-size:12.5px;font-weight:600}
@media (prefers-reduced-motion: reduce){.anim{display:none}}
</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#71717a"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#EC7981"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4ade80"/></marker>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs><rect width="440" height="808" rx="16" fill="#171717"/><rect x="16" y="18" width="10" height="10" rx="3" fill="#7dd3fc"/><text x="32" y="27.5" class="s" style="font-size:12px">User</text>
<rect x="80" y="18" width="10" height="10" rx="3" fill="#c4b5fd"/><text x="96" y="27.5" class="s" style="font-size:12px">AI</text>
<rect x="130" y="18" width="10" height="10" rx="3" fill="#5eead4"/><text x="146" y="27.5" class="s" style="font-size:12px">Me</text>
<rect x="180" y="18" width="10" height="10" rx="3" fill="#fbbf24"/><text x="196" y="27.5" class="s" style="font-size:12px">EUDAMED</text>
<text x="16" y="58" class="cap">PREPARATION · ONCE</text>
<rect x="16" y="70" width="408" height="70" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="80" width="3.5" height="50" rx="1.75" fill="#7dd3fc"/>
<text x="34" y="91" class="tag" fill="#7dd3fc">START</text>
<text x="34" y="112" class="t">Data is uploaded. Now it needs fixing.</text>
<text x="34" y="132" class="s">The portal isn't intuitive; no obvious way to update</text>
<line x1="220.0" y1="140" x2="220.0" y2="156" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="158" width="408" height="88" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="168" width="3.5" height="68" rx="1.75" fill="#c4b5fd"/>
<circle cx="402" cy="180" r="11" fill="none" stroke="#c4b5fd" stroke-opacity=".6"/><text x="402" y="184" text-anchor="middle" class="tag" fill="#c4b5fd">1</text>
<text x="34" y="179" class="tag" fill="#c4b5fd">AI READS</text>
<text x="34" y="200" class="t">Official guides and rules</text>
<text x="34" y="220" class="s">Data dictionary, business rules, upload manual</text>
<text x="34" y="238" class="s">First finding: most fields are locked once registered</text>
<line x1="220.0" y1="246" x2="220.0" y2="262" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="264" width="408" height="88" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="274" width="3.5" height="68" rx="1.75" fill="#c4b5fd"/>
<circle cx="402" cy="286" r="11" fill="none" stroke="#c4b5fd" stroke-opacity=".6"/><text x="402" y="290" text-anchor="middle" class="tag" fill="#c4b5fd">2</text>
<text x="34" y="285" class="tag" fill="#c4b5fd">AI MAPS</text>
<text x="34" y="306" class="t">Every supported upload path</text>
<text x="34" y="326" class="s">Screen entry, bulk upload (XML), system-to-system</text>
<text x="34" y="344" class="s">XML only. No official Excel template.</text>
<line x1="220.0" y1="352" x2="220.0" y2="368" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="370" width="408" height="70" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="380" width="3.5" height="50" rx="1.75" fill="#5eead4"/>
<circle cx="402" cy="392" r="11" fill="none" stroke="#5eead4" stroke-opacity=".6"/><text x="402" y="396" text-anchor="middle" class="tag" fill="#5eead4">3</text>
<text x="34" y="391" class="tag" fill="#5eead4">I DECIDE</text>
<text x="34" y="412" class="t">Bulk upload, own template + converter</text>
<text x="34" y="432" class="s">Commercial tools do the same; kept as a fallback</text>
<line x1="220.0" y1="440" x2="220.0" y2="456" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="458" width="408" height="70" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="468" width="3.5" height="50" rx="1.75" fill="#c4b5fd"/>
<circle cx="402" cy="480" r="11" fill="none" stroke="#c4b5fd" stroke-opacity=".6"/><text x="402" y="484" text-anchor="middle" class="tag" fill="#c4b5fd">4</text>
<text x="34" y="479" class="tag" fill="#c4b5fd">AI FETCHES</text>
<text x="34" y="500" class="t">Official XSD and sample XML</text>
<text x="34" y="520" class="s">One sample is a deliberate negative case. Don't copy it.</text>
<line x1="220.0" y1="528" x2="220.0" y2="544" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="546" width="408" height="70" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="556" width="3.5" height="50" rx="1.75" fill="#5eead4"/>
<circle cx="402" cy="568" r="11" fill="none" stroke="#5eead4" stroke-opacity=".6"/><text x="402" y="572" text-anchor="middle" class="tag" fill="#5eead4">5</text>
<text x="34" y="567" class="tag" fill="#5eead4">ME + AI</text>
<text x="34" y="588" class="t">Excel template built from the spec</text>
<text x="34" y="608" class="s">Required fields in red, dropdowns, per-row Check</text>
<line x1="220.0" y1="616" x2="220.0" y2="632" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="634" width="408" height="70" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="644" width="3.5" height="50" rx="1.75" fill="#5eead4"/>
<circle cx="402" cy="656" r="11" fill="none" stroke="#5eead4" stroke-opacity=".6"/><text x="402" y="660" text-anchor="middle" class="tag" fill="#5eead4">6</text>
<text x="34" y="655" class="tag" fill="#5eead4">ME + AI</text>
<text x="34" y="676" class="t">Converter → offline single-file page</text>
<text x="34" y="696" class="s">C# first, then an HTML page with nothing to install</text>
<line x1="220.0" y1="704" x2="220.0" y2="720" stroke="#71717a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="722" width="408" height="70" rx="10" fill="#232323" stroke="#3f3f46"/>
<rect x="16" y="732" width="3.5" height="50" rx="1.75" fill="#fbbf24"/>
<circle cx="402" cy="744" r="11" fill="none" stroke="#fbbf24" stroke-opacity=".6"/><text x="402" y="748" text-anchor="middle" class="tag" fill="#fbbf24">7</text>
<text x="34" y="743" class="tag" fill="#fbbf24">PROOF</text>
<text x="34" y="764" class="t">First batch goes live: SUCCESS</text>
<text x="34" y="784" class="s">Visible in the public lookup before handing over</text>
<path id="p1" d="M406,105.0 V757.0" fill="none" stroke="none"/>
<g class="anim"><circle r="6" fill="#c4b5fd" filter="url(#glow)" opacity=".9"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="2.6" fill="#fff"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle></g></svg>