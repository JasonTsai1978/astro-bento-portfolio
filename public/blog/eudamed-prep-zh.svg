<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 808" width="440" height="808" role="img" aria-label="準備期：AI 讀規格、我做判斷，打造範本與工具"><title>準備期：AI 讀規格、我做判斷，打造範本與工具</title><style>
text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif}
